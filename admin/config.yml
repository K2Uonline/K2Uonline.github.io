# Settings for the post editor at https://k2uonline.github.io/admin/
# Docs: https://sveltiacms.app/en/docs  ·  How to use it: docs/WRITING.md
#
# Every save is a commit to main in the private repo, which rebuilds and
# republishes the public site about a minute later.

app_title: K2U Writer
site_url: https://k2uonline.github.io

backend:
  name: github
  repo: K2Uonline/k2u-website
  branch: main
  # Sign in with a fine-grained GitHub token that can write to this private repo.
  # Nobody else has one, so nobody else can edit.
  auth_methods: [token]
  commit_messages:
    create: 'New {{collection}}: {{slug}}'
    update: 'Edit {{collection}}: {{slug}}'
    delete: 'Delete {{collection}}: {{slug}}'
    uploadMedia: 'Upload image {{path}}'
    deleteMedia: 'Delete image {{path}}'

# Images are saved in the repo under public/images and served from /images.
media_folder: public/images
public_folder: /images
media_libraries:
  default:
    config:
      max_file_size: 26214400 # 25 MB before shrinking
      slugify_filename: true # "My Photo.JPG" → my-photo.webp
      transformations:
        # Shrink big photos and convert to WebP so pages load fast.
        jpeg: { format: webp, quality: 85, width: 2000, height: 2000 }
        png: { format: webp, quality: 85, width: 2000, height: 2000 }
        heic: { format: webp, quality: 85, width: 2000, height: 2000 }

slug:
  encoding: ascii
  clean_accents: true

collections:
  # ── Posts ─────────────────────────────────────────────────────────────────
  # Every post lives in content/posts/. Its Topic decides where it shows up:
  # a post with topic "life" is at /life/<post-slug>/.
  - name: posts
    label: Posts
    label_singular: Post
    icon: article
    folder: content/posts
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    summary: '{{title}} · {{date}}'
    sortable_fields: { fields: [date, title], default: { field: date, direction: descending } }
    view_groups:
      groups:
        - { name: topic, label: Topic, field: topic }
      default: topic
    fields:
      - { label: Title, name: title, widget: string }
      - label: Topic
        name: topic
        widget: relation
        collection: settings
        file: topics
        value_field: 'topics.*.slug'
        display_fields: ['topics.*.name']
        search_fields: ['topics.*.name']
        hint: 'Add or rename topics under **Settings → Topics**.'
      - label: Date
        name: date
        widget: datetime
        format: YYYY-MM-DD
        time_format: false
        default: '{{now}}'
      - { label: Short description, name: excerpt, widget: string, hint: 'Shown on post cards and link previews.' }
      - { label: Cover image, name: coverImage, widget: image, required: false }
      - label: Draft
        name: draft
        widget: boolean
        default: false
        required: false
        hint: 'Drafts are saved but not shown on the site.'
      - { label: Body, name: body, widget: markdown }

  # ── Settings → Topics ─────────────────────────────────────────────────────
  # The site's topics (menu sections), stored in content/topics.yml.
  - name: settings
    label: Settings
    icon: settings
    files:
      - name: topics
        label: Topics
        icon: folder
        file: content/topics.yml
        format: yaml
        fields:
          - label: Topics
            name: topics
            widget: list
            label_singular: topic
            summary: '{{fields.name}}  (/{{fields.slug}}/)'
            hint: 'Drag to reorder: this is the order in the top menu.'
            fields:
              - { label: Name, name: name, widget: string, hint: 'Shown in the menu and on the topic page. Safe to change any time.' }
              - label: URL
                name: slug
                widget: string
                pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', 'Lowercase letters, numbers and dashes only, like "book-notes".']
                hint: 'The web address: **book-notes** → k2uonline.github.io/book-notes/. Don''t change it after posts use this topic.'
              - { label: Description, name: description, widget: string, required: false, hint: 'Optional line under the title on the topic page.' }
              - { label: Show in menu, name: show_in_menu, widget: boolean, default: true, required: false }
